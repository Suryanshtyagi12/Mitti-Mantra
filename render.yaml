services:
  - type: web
    name: mittimantra-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd mittimantra_backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      # Hugging Face CNN model (.keras full model — no manual reconstruction)
      - key: HF_MODEL_REPO
        value: tyagisurya001/plant-disease-detector
      - key: HF_MODEL_FILENAME
        value: plant_disease_model.keras
      - key: HF_MODEL_METADATA
        value: metadata.json
